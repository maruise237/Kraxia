# Kraxia — déploiement Dokploy / Coolify / docker compose
#
# Architecture multi-tenant :
#   frontend (public:3000) ──► gateway (FastAPI, port $PORT)
#                                    │
#                                    ├──► postgres (interne)
#                                    └──► spawn de conteneurs utilisateur à la volée
#                                         via le socket Docker monté côté hôte
#
# Dokploy / Coolify reconnaissent ce fichier et provisionnent automatiquement
# les services, réseaux, volumes et healthchecks.

name: kraxia

services:
  postgres:
    image: postgres:16-alpine
    container_name: kraxia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kraxia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kraxia}
      POSTGRES_DB: ${POSTGRES_DB:-kraxia_platform}
    volumes:
      - kraxia_pgdata:/var/lib/postgresql/data
    networks:
      - kraxia-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kraxia} -d ${POSTGRES_DB:-kraxia_platform}"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    container_name: kraxia-gateway
    build:
      context: ./platform
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:${PORT:-8080}"
    environment:
      PLATFORM_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kraxia}:${POSTGRES_PASSWORD:-kraxia}@postgres:5432/${POSTGRES_DB:-kraxia_platform}
      PLATFORM_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis en production}
      PLATFORM_ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      PLATFORM_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD requis}

      # Clés API des fournisseurs LLM (laisser vide les fournisseurs non utilisés)
      PLATFORM_ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PLATFORM_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PLATFORM_OPENAI_API_BASE: ${OPENAI_API_BASE:-}
      PLATFORM_DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      PLATFORM_OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      PLATFORM_DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      PLATFORM_MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      PLATFORM_MINIMAX_API_BASE: ${MINIMAX_API_BASE:-}
      PLATFORM_AIHUBMIX_API_KEY: ${AIHUBMIX_API_KEY:-}
      PLATFORM_EVOLINK_API_KEY: ${EVOLINK_API_KEY:-}
      PLATFORM_MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
      PLATFORM_KIMI_API_KEY: ${KIMI_API_KEY:-}
      PLATFORM_ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      PLATFORM_DOUBAO_API_KEY: ${DOUBAO_API_KEY:-}
      PLATFORM_DEFAULT_MODEL: ${DEFAULT_MODEL:-dashscope/qwen3-coder-plus}
      PLATFORM_SHARED_OPENCLAW_ENABLED: ${PLATFORM_SHARED_OPENCLAW_ENABLED:-true}
      PLATFORM_CONTAINER_TZ: ${CONTAINER_TZ:-UTC}
      PLATFORM_CONTAINER_MEMORY_LIMIT: ${PLATFORM_CONTAINER_MEMORY_LIMIT:-2g}
      PLATFORM_TRAINING_TRACE_ENABLED: ${PLATFORM_TRAINING_TRACE_ENABLED:-false}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # création de conteneurs utilisateur
      - kraxia_traces:/app/.hermes/training_traces
    networks:
      - kraxia-internal
      - kraxia-external
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    container_name: kraxia-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:${PORT:-3000}"
    networks:
      - kraxia-external
    depends_on:
      - gateway

networks:
  kraxia-internal:
    name: kraxia-internal
    driver: bridge
  kraxia-external:
    name: kraxia-external
    driver: bridge

volumes:
  kraxia_pgdata:
  kraxia_traces:
